<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. — Liga-Spieler & Passnummern</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162238;
            --card-border: #23334d;
            --accent: #3b82f6;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header & Logos */
        .app-main-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .header-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .header-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: contain;
            border: 3px solid var(--accent-gold);
            background: #0f172a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            padding: 4px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .app-main-header h1 {
            color: var(--accent-gold);
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        select, input {
            background: #0b1329;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-bar select, .filter-bar input {
            flex: 1;
            min-width: 180px;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            font-size: 0.9rem;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: #0d172a;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .team-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin: 20px 0 10px 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-count-badge {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: normal;
        }

        .tc-badge {
            background: rgba(234, 179, 8, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(234, 179, 8, 0.3);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 6px;
        }

        .empty-row {
            text-align: center;
            color: var(--text-muted);
            padding: 15px !important;
        }

        @media (max-width: 600px) {
            .app-main-header h1 {
                font-size: 1.5rem;
            }
            .header-logo {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header mit Logos links und rechts -->
    <div class="app-main-header">
        <div class="header-title-row">
            <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
            <h1>TV Kapellen 1919 e.V.</h1>
            <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
        </div>
        <div class="app-subtitle">Liga-Spieler & Passnummern (Saison 2026/2027)</div>
    </div>

    <!-- Kader-Übersicht & Filter -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h3 style="margin: 0;">📋 Vereins-Kader</h3>
            <span id="playerCount" style="font-size: 0.85rem; color: var(--text-muted);">0 Spieler insgesamt</span>
        </div>

        <div class="filter-bar">
            <!-- Dropdown Menü zum Filtern nach Mannschaft -->
            <select id="teamFilter" onchange="renderApp()">
                <option value="ALL">🎯 Alle Mannschaften anzeigen</option>
                <option value="TV Kapellen 3">TV Kapellen 3</option>
                <option value="TV Kapellen 1">TV Kapellen 1</option>
                <option value="TV Kapellen 2">TV Kapellen 2</option>
                <option value="TV Kapellen 4">TV Kapellen 4</option>
            </select>

            <!-- Suchfeld -->
            <input type="text" id="searchInput" placeholder="🔍 Spieler oder Passnummer suchen..." oninput="renderApp()">
        </div>

        <div id="teamsContainer">
            <!-- Wird dynamisch ausgegeben -->
        </div>
    </div>
</div>

<script>
    const INITIAL_PLAYERS = [
        // TV Kapellen 3 (inkl. Florian Hartwich)
        { team: "TV Kapellen 3", name: "Jürgen Schützendorf TC 1", pass: "24129" },
        { team: "TV Kapellen 3", name: "Wolfram Senger", pass: "21071" },
        { team: "TV Kapellen 3", name: "Michael Müller", pass: "25252" },
        { team: "TV Kapellen 3", name: "Ludger Schledorn", pass: "22366" },
        { team: "TV Kapellen 3", name: "Markus Ginsel TC 2", pass: "22356" },
        { team: "TV Kapellen 3", name: "Niklas Weichert", pass: "23680" },
        { team: "TV Kapellen 3", name: "Thomas Kliver", pass: "22371" },
        { team: "TV Kapellen 3", name: "Lars Neutag", pass: "23240" },
        { team: "TV Kapellen 3", name: "Markus Lenz", pass: "22369" },
        { team: "TV Kapellen 3", name: "Andreas Denner", pass: "21556" },
        { team: "TV Kapellen 3", name: "Florian Hartwich", pass: "24128" },
        { team: "TV Kapellen 3", name: "Yannick Steffes", pass: "25999" },
        { team: "TV Kapellen 3", name: "Gregor Marek", pass: "25998" },

        // TV Kapellen 1
        { team: "TV Kapellen 1", name: "Joel Wielinski", pass: "24540" },
        { team: "TV Kapellen 1", name: "Jan Krabbe", pass: "24151" },
        { team: "TV Kapellen 1", name: "Dominik Helmke", pass: "24132" },
        { team: "TV Kapellen 1", name: "Denis Vanzidler", pass: "24541" },
        { team: "TV Kapellen 1", name: "Tim Siegel", pass: "23678" },
        { team: "TV Kapellen 1", name: "Patrik Seitz TC 1", pass: "23102" },
        { team: "TV Kapellen 1", name: "Robert Geyer", pass: "22355" },
        { team: "TV Kapellen 1", name: "Fabio Padovano", pass: "24131" },
        { team: "TV Kapellen 1", name: "Dirk Kraus", pass: "16239" },
        { team: "TV Kapellen 1", name: "Stefan Melcher TC 2", pass: "21374" },
        { team: "TV Kapellen 1", name: "Sascha Bien", pass: "22352" },

        // TV Kapellen 2
        { team: "TV Kapellen 2", name: "Dominik Herz", pass: "22741" },
        { team: "TV Kapellen 2", name: "Daniel Simanowitz", pass: "23011" },
        { team: "TV Kapellen 2", name: "Thomas Franzen TC 2", pass: "22859" },
        { team: "TV Kapellen 2", name: "Markus Elgersma", pass: "22354" },
        { team: "TV Kapellen 2", name: "Holger Weberpold", pass: "22350" },
        { team: "TV Kapellen 2", name: "Danny Voß", pass: "24758" },
        { team: "TV Kapellen 2", name: "Markus Thiele", pass: "22363" },
        { team: "TV Kapellen 2", name: "Philip Möller TC 1", pass: "22743" },
        { team: "TV Kapellen 2", name: "Christian Schreiber", pass: "15653" },

        // TV Kapellen 4
        { team: "TV Kapellen 4", name: "Friedhelm Schmidt-Cremer", pass: "23676" },
        { team: "TV Kapellen 4", name: "Scott Jonen", pass: "23672" },
        { team: "TV Kapellen 4", name: "Britta Roghmans TC 1", pass: "22365" },
        { team: "TV Kapellen 4", name: "Dirk Grunert", pass: "22362" },
        { team: "TV Kapellen 4", name: "Mark Bock", pass: "22361" },
        { team: "TV Kapellen 4", name: "Leon Overmann", pass: "25251" },
        { team: "TV Kapellen 4", name: "Brian Müller", pass: "25250" },
        { team: "TV Kapellen 4", name: "Jesper Neutag", pass: "22129" },
        { team: "TV Kapellen 4", name: "Björn Mentzen TC 2", pass: "23674" },
        { team: "TV Kapellen 4", name: "Lucas Mentzen", pass: "23675" },
        { team: "TV Kapellen 4", name: "Lars Hufen", pass: "22357" }
    ];

    const TEAM_ORDER = ["TV Kapellen 3", "TV Kapellen 1", "TV Kapellen 2", "TV Kapellen 4"];

    function renderApp() {
        const container = document.getElementById("teamsContainer");
        const searchInput = document.getElementById("searchInput").value.toLowerCase();
        const teamFilter = document.getElementById("teamFilter").value;
        const countSpan = document.getElementById("playerCount");

        countSpan.textContent = `${INITIAL_PLAYERS.length} Spieler insgesamt`;
        container.innerHTML = "";

        let activeTeams = teamFilter === "ALL" ? TEAM_ORDER : [teamFilter];

        activeTeams.forEach(teamName => {
            let teamPlayers = INITIAL_PLAYERS.filter(p => {
                const matchesTeam = p.team === teamName;
                const matchesSearch = p.name.toLowerCase().includes(searchInput) || p.pass.toLowerCase().includes(searchInput);
                return matchesTeam && matchesSearch;
            });

            if (teamPlayers.length === 0 && searchInput !== "" && teamFilter !== "ALL") return;
            if (teamPlayers.length === 0 && teamFilter === "ALL" && searchInput !== "") return;

            let html = `
                <div class="team-title">
                    <span>🎯 ${teamName}</span>
                    <span class="team-count-badge">${teamPlayers.length} Spieler</span>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 10%; text-align: center;">#</th>
                                <th style="width: 55%;">Spielername</th>
                                <th style="width: 35%;">Pass-Nummer</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (teamPlayers.length === 0) {
                html += `<tr><td colspan="3" class="empty-row">Keine Spieler gefunden.</td></tr>`;
            } else {
                teamPlayers.forEach((p, index) => {
                    let displayName = p.name;
                    if (displayName.includes("TC")) {
                        let tcMatch = displayName.match(/TC\s*\d*/);
                        let tcText = tcMatch ? tcMatch[0] : "TC";
                        displayName = displayName.replace(/TC\s*\d*/g, '').trim() + ` <span class="tc-badge">${tcText}</span>`;
                    }

                    html += `
                        <tr>
                            <td style="text-align: center; color: var(--accent-gold); font-weight: bold;">${index + 1}</td>
                            <td style="font-weight: bold;">${displayName}</td>
                            <td style="color: var(--accent-gold); font-family: monospace;">${p.pass}</td>
                        </tr>
                    `;
                });
            }

            html += `</tbody></table></div>`;
            container.innerHTML += html;
        });
    }

    renderApp();
</script>

</body>
</html>
